[package]
name = "flyterm-server"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "flyterm_server"
path = "src/lib.rs"

[[bin]]
name = "flyterm-server"
path = "src/main.rs"

[dependencies]
aqt_protocol = { path = "../aqt_protocol" }
bytes = { workspace = true }
tokio = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
ring = { workspace = true }
anyhow = { workspace = true }
futures = { version = "0.3", default-features = false, features = ["std"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
portable-pty = { workspace = true }
rusqlite = { workspace = true, optional = true }
nix = { version = "0.27", features = ["fs", "process", "signal", "user"] }
vt100 = "0.15"

[features]
compression = []
# history: PTY session history logging to SQLite.
# persist-sessions: persist QUIC session tokens across server restarts
#                   (enables 0-RTT RESUME after daemon restart).
# Both pull in rusqlite/bundled (+~550 KB). Disabled by default in the
# APK-bundled binary — basic PTY functionality works without them.
history          = ["dep:rusqlite"]
persist-sessions = ["dep:rusqlite"]

[dev-dependencies]
tempfile = "=3.13.0"
anyhow = { workspace = true }
rustls = { workspace = true }
