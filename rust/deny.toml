# cargo-deny: keeps the Rust dependency tree GPL-compatible and free of known
# vulnerabilities. Run from rust/: `cargo deny check -W unmaintained`.
#
# Why this exists: quinn 0.10 silently pulled in ring 0.16, whose
# OpenSSL/SSLeay-licensed code is incompatible with the GPL, and pinned a
# quinn-proto with remotely triggerable advisories. Nothing checked either.

[graph]
all-features = true

[advisories]
version = 2
# Vulnerabilities and unsound advisories always fail. Unmaintained-crate
# notices are checked for every crate but should only warn — that is the
# `-W unmaintained` on the command line (CI passes it too). Setting
# `unmaintained = "none"` here would not downgrade them, it would stop
# checking altogether.
yanked = "deny"

[licenses]
version = 2
# Only GPL-3.0-compatible licenses. OpenSSL / SSLeay are deliberately absent.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "Unlicense",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.9
# The list is a policy, not an inventory: entries no current crate uses are fine.
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
deny = [
    # aws-lc is rustls/quinn's default crypto backend and contains
    # OpenSSL-licensed code; FlyTerm uses the ring backend.
    { crate = "aws-lc-sys", reason = "OpenSSL-licensed code; GPL-incompatible" },
    { crate = "aws-lc-rs", reason = "OpenSSL-licensed code; GPL-incompatible" },
    { crate = "openssl-sys", reason = "OpenSSL license; GPL-incompatible" },
    { crate = "openssl", reason = "OpenSSL license; GPL-incompatible" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
