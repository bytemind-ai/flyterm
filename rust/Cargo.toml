[workspace]
resolver = "2"
members = [
    "aqt_protocol", "flyterm-server", "aqt_client_ffi",
    "quic_e2e"]
exclude = ["aqt_protocol/fuzz"]

[workspace.package]
edition = "2021"
rust-version = "1.99"
license = "GPL-3.0-or-later"
authors = ["FlyTerm contributors"]

[workspace.dependencies]
bytes = "1.5"
thiserror = "1.0"
proptest = "=1.8.0"
tempfile = "=3.13.0"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "signal", "fs", "net"] }
# ring backend only: aws-lc (the rustls/quinn default) carries OpenSSL-licensed
# code, which is GPL-incompatible. Enforced by deny.toml.
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio", "log"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
rcgen = "0.12"
anyhow = "1"
clap = { version = "=4.4.18", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
portable-pty = "0.9"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
parking_lot = "0.12"
x509-parser = "0.15"
ring = "0.17.12"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"

# vendor/vt100 相对上游的三处改动，**全部是加法**（没有改写上游任何现有
# 函数体），这样 vt100 升版时重新应用最省事。
#
# 1. dim(SGR 2) 属性位。客户端 painter.dart:187 会渲染 faint，而上游
#    Attrs.mode 里没有这一位。mode 是 u8、只用了 4 位（bold/italic/
#    underline/inverse），加一位是纯增量。补齐之后快照的表达能力 ⊇ 客户端的
#    渲染能力，恢复才能只发快照而不必回放 raw —— 那是取消 offset 语义的前提。
#
# 2. scrollback 的只读读取（grid.rs `scrollback_rows`、screen.rs
#    `scrollback_rows_formatted` / `primary_*` 四个访问器 + `format_rows`）。
#    恢复负载的历史段必须与当前屏段出自同一个求值状态，否则就是「逻辑行数减
#    物理行数」那个单位不匹配的老 bug。上游只有 `set_scrollback` 这一条路，而它
#    把 offset 夹到 `scrollback.len()`、没夹到 `rows.len()` —— offset 超过一屏时
#    `visible_rows()` 里的 `rows_len - offset` 会下溢 panic，所以「反复
#    set_scrollback 走窗口」读不出整段 scrollback。只读也让 RESUME 路径不必把
#    parser 的读锁升成写锁。
#
# 3. ED 3（`CSI 3 J`，清 scrollback）。上游把 mode 3 落进
#    `unhandled ED mode`，于是用户 `clear` 掉的内容仍留在 scrollback 里，
#    恢复时又作为「历史」回放出来。
[patch.crates-io]
vt100 = { path = "vendor/vt100" }
