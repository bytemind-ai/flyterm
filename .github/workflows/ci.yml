# PR 必过门禁。analyze 与 test 都是硬门禁 —— 开源项目首发时 analyze 红是
# 第一印象最伤的状态，而第一印象只有一次。
name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  FLUTTER_VERSION: '3.47.2'
  # build-server-assets.sh（Gradle 也会调它）在 aarch64 失败时直接报错，
  # 不让 ARM 服务端悄悄缺席。
  FLYTERM_REQUIRE_AARCH64: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install libsqlite3 (sqflite_common_ffi tests need it)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: flutter pub get
      - run: flutter gen-l10n

      # 硬门禁：error > 0 即失败。info 级不阻塞。
      - name: Analyze
        run: |
          flutter analyze 2>&1 | tee /tmp/analyze.log
          ERRORS=$(grep -cE '^\s+error ' /tmp/analyze.log || true)
          echo "errors: $ERRORS"
          test "$ERRORS" -eq 0

      - name: Test
        run: flutter test

  build-android:
    runs-on: ubuntu-latest
    steps:
      # 标准 runner 只剩 ~14 GB：Flutter + Android SDK/NDK + Rust（两个 musl
      # target）+ zig + 两次 Rust 构建会把它撑爆（No space left on device）。
      # 删掉这个 job 用不到的预装工具链；Android SDK 和 Java 要留着。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /opt/microsoft /opt/google \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99'
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,aarch64-linux-android

      - run: sudo apt-get update && sudo apt-get install -y musl-tools

      # aarch64 服务端靠 cargo-zigbuild 交叉编译。装预编译版，省掉每次
      # cargo install 的编译时间。
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild,cargo-ndk

      # Gradle 的 buildAqtClientFfi 用 cargo-ndk 交叉编译 Rust FFI，NDK 取自
      # ANDROID_NDK_HOME。runner 预设它指向别的 NDK 版本；改成与
      # android.ndkVersion 一致（AGP 在配置阶段会自动装好这个版本）。
      - name: Pin ANDROID_NDK_HOME to android.ndkVersion
        run: |
          NDK_VER=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> "$GITHUB_ENV"

      - run: flutter pub get
      - run: flutter gen-l10n

      # 产物不分发，debug 签名即可。
      - name: Build APK (debug-signed)
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm64 \
            -PallowDebugSigning=true

      - name: Verify the APK bundles flyterm-server
        run: python3 scripts/verify_apk_server_assets.py build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
