name: flyterm
description: "A coding agent for your phone. Runs on your servers over SSH, Mosh, or QUIC; tasks survive the screen locking, and approvals arrive as push notifications."
repository: https://github.com/bytemind-ai/flyterm
issue_tracker: https://github.com/bytemind-ai/flyterm/issues
# 这是 app 不是 package，不发 pub.dev —— 保留这行防止误发布。
publish_to: 'none'

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.8.0+64

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  # 计划任务的时区解释（cron 的 timezone 列）。flutter_local_notifications
  # 已把它传递引入，这里显式声明是因为我们**直接** import 它（cron_expr.dart）。
  # tzdata 用 latest_10y 变体（见该文件的 ensureTimeZonesInitialized）。
  timezone: ^0.10.1
  dartssh2: ^2.17.0
  xterm: ^4.0.0
  flutter_secure_storage: ^10.0.0
  sqflite: ^2.4.2
  path: ^1.9.0
  path_provider: ^2.1.5
  connectivity_plus: ^7.1.1
  provider: ^6.1.5
  pointycastle: ^4.0.0
  pinenacl: ^0.6.0
  uuid: ^4.5.3
  dio: ^5.7.0
  html: ^0.15.7
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  package_info_plus: ^8.3.1
  file_picker: ^8.0.0
  open_filex: ^4.7.0
  share_plus: ^10.1.4
  flutter_foreground_task: ^9.2.2
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.3.5
  # 8.x 的原生 SDK 与 Xcode 26 不兼容（SentryBinaryImageCache.image 编译报错），
  # iOS 构建会挂在 SentryFlutter.swift。9.x 起修复。
  sentry_flutter: ^9.29.0
  crypto: ^3.0.3
  # flutter_markdown 已被官方标记 discontinued（0.7.7+1 是最后一版），
  # flutter_markdown_plus 是其社区延续（README 明示 continuation of the
  # original flutter_markdown），API 同构 —— 见 2026-09-04-ios-launch-design
  # spec A 节。升级时留意 `MarkdownElementBuilder.visitElementAfter` 签名。
  flutter_markdown_plus: ^1.0.12
  local_auth: ^2.3.0
  flutter_pty: ^0.4.0
  clock: ^1.1.1
  ffi: ^2.1.3
  http: ^1.2.2
  url_launcher: ^6.3.0
  in_app_update: ^4.2.3

dependency_overrides:
  xterm:
    path: packages/xterm
  dartssh2:
    path: patches/dartssh2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9
  sqflite_common_ffi: ^2.3.3
  fake_async: ^1.3.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/flyterm-server/
    - assets/builtin_skills/

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: CourierPrime
      fonts:
        - asset: assets/fonts/CourierPrime-Regular.ttf
        - asset: assets/fonts/CourierPrime-Bold.ttf
          weight: 700
    # Monospaced symbol fallback. The primary terminal fonts (JetBrainsMono
    # 0.600 em, CourierPrime 0.600 em) have no glyphs for the Ballot Box /
    # heavy-check range, so Skia falls through to this. DejaVu Sans Mono is
    # itself monospaced at 0.602 em, which keeps those glyphs inside their
    # cell — NotoSansSymbols2 is proportional (☐ 0.821 em, ✔ 0.930 em) and
    # overflows the cell, clipping into the neighbouring column.
    - family: DejaVuSansMono
      fonts:
        - asset: assets/fonts/DejaVuSansMono.ttf
    - family: NotoSansSymbols2
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-Regular.ttf
